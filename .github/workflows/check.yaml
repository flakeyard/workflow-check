# Reusable check workflow. A repository calls it from its check workflow as
# the last job, with the id check, and passes the results of its other jobs as
# the input needs. It checks the flake.lock of the repository's flake and
# builds the flake's checks on every system the flake declares, and checks
# what only the event and the API can tell. The job required, whose check is
# "check / required", fails unless every job of the run succeeded; on
# workflow_dispatch the workflow also posts that result as a commit status.
# Each step's logic lives in .github/actions.
name: check

on:
  workflow_call:
    inputs:
      needs:
        description: >-
          The results of the caller's other jobs: toJSON(needs) of the job that
          calls this workflow, also when it has no needs.
        type: string
        required: true
      caller-may-skip:
        description: JSON array of the caller's job ids that may be skipped.
        type: string
        default: "[]"
      flake:
        description: >-
          The flake whose checks are built, "." or a path below the
          repository, such as ./dev. Empty builds none.
        type: string
        default: .
      systems:
        description: >-
          JSON array of {system, runner}: the runner of every system the flake
          declares, no more and no fewer.
        type: string
        default: >-
          [{"system":"x86_64-linux","runner":"ubuntu-24.04"},
          {"system":"aarch64-linux","runner":"ubuntu-24.04-arm"}]
      expect-checks:
        description: JSON array of check names that the flake must have.
        type: string
        default: "[]"
      extra-substituters:
        description: Binary caches to use besides cache.nixos.org.
        type: string
        default: ""
      extra-trusted-public-keys:
        description: Public keys of the extra caches.
        type: string
        default: ""
      timeout-minutes:
        description: Timeout of each job that builds the flake checks.
        type: number
        default: 60
      pr-title:
        description: >-
          Check that pull request titles follow Conventional Commits. false
          switches the check off; it then succeeds with a notice.
        type: boolean
        default: true
      pr-title-types:
        description: The types allowed in pull request titles.
        type: string
        default: feat fix docs chore ci refactor test build perf revert
      renovate-config:
        description: >-
          Check that renovate.json is the only Renovate configuration and
          extends a preset of renovate-presets. false switches the check off;
          it then succeeds with a notice.
        type: boolean
        default: true
      renovate-presets:
        description: >-
          JSON array of owner/repo whose presets renovate.json must extend;
          empty allows any preset.
        type: string
        default: "[]"
      release-tags:
        description: >-
          Check that every Renovate preset and Copier template is pinned to
          the tag of an immutable GitHub release. false switches the check
          off; it then succeeds with a notice.
        type: boolean
        default: true
      allow-unpinned:
        description: >-
          JSON array of owner/repo whose presets and templates release-tags
          does not check.
        type: string
        default: "[]"
      flake-lock:
        description: >-
          Check flake.lock with action-flake-lock: flakeyard inputs are
          released, no source is locked twice and root inputs are pinned in
          one form. false switches the check off; it then succeeds with a
          notice.
        type: boolean
        default: true
      allow-duplicates:
        description: >-
          JSON array of the normalized sources that flake.lock may lock more
          than once, such as github.com/nixos/nixpkgs.
        type: string
        default: "[]"
      nixpkgs-eol:
        description: >-
          Check with action-flake-lock that the nixpkgs branches of flake.lock
          have not reached their end of life: a warning from 30 days before
          it, a failure after it in scheduled runs. false switches the check
          off; it then succeeds with a notice.
        type: boolean
        default: true

permissions: {}

jobs:
  pending:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      actions: read # the name of this job
      statuses: write # the commit status of a dispatched run
    steps:
      - id: lib
        uses: flakeyard/action-shell-lib@ef6978e8074ba1891610e4fcfd9a84a6da8d5c7f # v0.1.4
      - id: context
        uses: $/.github/actions/context
        with:
          shell-lib: ${{ steps.lib.outputs.path }}
          check-run-id: ${{ job.check_run_id }}
      - uses: $/.github/actions/commit-status
        with:
          shell-lib: ${{ steps.lib.outputs.path }}
          state: pending
          context: ${{ steps.context.outputs.context }}

  meta:
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read # repository files through the contents API
      pull-requests: read # the title of the pull request
    # Every check runs also when another one failed, and the library step
    # whenever a check does.
    steps:
      - id: lib
        if: ${{ !cancelled() }}
        uses: flakeyard/action-shell-lib@ef6978e8074ba1891610e4fcfd9a84a6da8d5c7f # v0.1.4
      - uses: $/.github/actions/preflight
        with:
          shell-lib: ${{ steps.lib.outputs.path }}
      - if: ${{ !cancelled() }}
        uses: $/.github/actions/pr-title
        with:
          shell-lib: ${{ steps.lib.outputs.path }}
          enabled: ${{ inputs.pr-title }}
          types: ${{ inputs.pr-title-types }}
      - if: ${{ !cancelled() }}
        uses: $/.github/actions/renovate-config
        with:
          shell-lib: ${{ steps.lib.outputs.path }}
          enabled: ${{ inputs.renovate-config }}
          presets: ${{ inputs.renovate-presets }}
      - if: ${{ !cancelled() }}
        uses: $/.github/actions/release-tags
        with:
          shell-lib: ${{ steps.lib.outputs.path }}
          enabled: ${{ inputs.release-tags }}
          allow-unpinned: ${{ inputs.allow-unpinned }}
      # The check of flake.lock, with the end of life of nixpkgs, runs in the
      # flake jobs.
      - if: ${{ !cancelled() }}
        uses: $/.github/actions/flake-lock-notice
        with:
          shell-lib: ${{ steps.lib.outputs.path }}
          enabled: ${{ inputs.flake-lock }}
          flake: ${{ inputs.flake }}
          nixpkgs-eol: ${{ inputs.nixpkgs-eol }}

  flake:
    # No name: GitHub names each job after its matrix values, and a job
    # skipped before the matrix expands is named flake instead of showing an
    # unexpanded expression.
    if: ${{ !cancelled() && inputs.flake != '' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(inputs.systems) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ inputs.timeout-minutes }}
    permissions:
      contents: read # the flake
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lib
        if: ${{ !cancelled() }}
        uses: flakeyard/action-shell-lib@ef6978e8074ba1891610e4fcfd9a84a6da8d5c7f # v0.1.4
      - id: flake-lock-inputs
        if: ${{ inputs.flake-lock }}
        uses: $/.github/actions/flake-lock-inputs
        with:
          shell-lib: ${{ steps.lib.outputs.path }}
          flake: ${{ inputs.flake }}
          allow-duplicates: ${{ inputs.allow-duplicates }}
      - uses: flakeyard/action-setup-nix@0a6360ba8fee1bb4da86d28ec4a1d204aa047be3 # v0.1.4
        with:
          extra-substituters: ${{ inputs.extra-substituters }}
          extra-trusted-public-keys: ${{ inputs.extra-trusted-public-keys }}
      # Before the flake is evaluated. It reads releases with github.token,
      # which needs no permissions.
      - if: ${{ inputs.flake-lock }}
        uses: flakeyard/action-flake-lock@a3d4a8f9233ad1ff08300e5e9f695d3b64675c40 # v0.2.1
        with:
          path: ${{ steps.flake-lock-inputs.outputs.path }}
          allow-duplicates: ${{ steps.flake-lock-inputs.outputs.allow-duplicates }}
          nixpkgs-eol: ${{ inputs.nixpkgs-eol }}
      # Also when the check of flake.lock failed, so that one run reports both.
      - if: ${{ !cancelled() }}
        uses: $/.github/actions/flake-checks
        with:
          shell-lib: ${{ steps.lib.outputs.path }}
          flake: ${{ inputs.flake }}
          system: ${{ matrix.system }}
          systems: ${{ inputs.systems }}
          expect-checks: ${{ inputs.expect-checks }}

  required:
    needs: [pending, meta, flake]
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read # the name of this job and the jobs of the run
      statuses: write # the commit status of a dispatched run
    steps:
      # Also in a cancelled run, so that the final status gets the library.
      - id: lib
        if: ${{ always() }}
        uses: flakeyard/action-shell-lib@ef6978e8074ba1891610e4fcfd9a84a6da8d5c7f # v0.1.4
      - id: verdict
        uses: $/.github/actions/required
        with:
          shell-lib: ${{ steps.lib.outputs.path }}
          caller: ${{ inputs.needs }}
          check: ${{ toJSON(needs) }}
          caller-may-skip: ${{ inputs.caller-may-skip }}
          # The jobs above that the event or the inputs skip.
          check-may-skip: >-
            {"pending": ${{ github.event_name != 'workflow_dispatch' }},
            "flake": ${{ inputs.flake == '' }}}
          check-run-id: ${{ job.check_run_id }}
      # A dispatched run reports its result on every outcome.
      - id: context
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: $/.github/actions/context
        with:
          shell-lib: ${{ steps.lib.outputs.path }}
          check-run-id: ${{ job.check_run_id }}
      - if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: $/.github/actions/commit-status
        with:
          shell-lib: ${{ steps.lib.outputs.path }}
          state: ${{ steps.verdict.outcome == 'success' && 'success' || 'failure' }}
          context: ${{ steps.context.outputs.context }}
