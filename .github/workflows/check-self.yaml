# CI of this repository: the actions on fixtures that must pass or fail, then
# the product workflow of the pull request itself, called as every repository
# calls it, which also builds the checks of the repository's flake.
name: check-self

on:
  pull_request:
    types: [opened, synchronize, reopened, edited] # edited: the title check
  push:
    branches: [main, "release/v*"]
  schedule:
    - cron: "23 4 * * 1"
  workflow_dispatch: # dispatched checks of release pull requests (FY-0030)

permissions: {}

concurrency:
  group: check-self-${{ github.ref }}
  # A title or description edit must not cancel a long run.
  cancel-in-progress: >-
    ${{ github.event_name == 'pull_request'
        && github.event.action != 'edited' }}

jobs:
  # The flake checks of fixtures that must pass or fail, on x86_64-linux;
  # the repository's own flake is checked by the call below.
  fixtures:
    name: Fixture ${{ matrix.case }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - case: pass
            fixture: pass
            expect-checks: '["ok"]'
            outcome: success
          - case: failing-check
            fixture: failing-check
            expect-checks: "[]"
            outcome: failure
          - case: missing-check
            fixture: pass
            expect-checks: '["ok","missing"]'
            outcome: failure
          - case: eval-error
            fixture: eval-error
            expect-checks: "[]"
            outcome: failure
          - case: undeclared-system
            fixture: undeclared-system
            expect-checks: "[]"
            outcome: failure
          - case: stale-lock
            fixture: stale-lock
            expect-checks: "[]"
            outcome: failure
          # The checks evaluate only with the input dep overridden by the
          # fixture pass at a commit of main.
          - case: override
            fixture: override
            expect-checks: '["ok"]'
            override-inputs: >-
              {"dep":
              "git+https://github.com/flakeyard/workflow-check?ref=main&rev=9d89927b700cb1159755015336ad02e8a03eb254&shallow=1&dir=tests/fixtures/flakes/pass"}
            outcome: success
          - case: no-override
            fixture: override
            expect-checks: '["ok"]'
            outcome: failure
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lib
        uses: flakeyard/action-shell-lib@d2f4905ffa8bcea6bb6be2928d90db9037d5bdef # v0.3.0
      - uses: flakeyard/action-setup-nix@a221f6da7d616d4d548659d91f24f5e8f8f77fda # v0.1.6
      - id: flake-checks
        continue-on-error: true
        uses: $/.github/actions/flake-checks
        with:
          shell-lib: ${{ steps.lib.outputs.path }}
          flake: ./tests/fixtures/flakes/${{ matrix.fixture }}
          system: x86_64-linux
          systems: >-
            [{"system":"x86_64-linux","runner":"ubuntu-24.04"},
            {"system":"aarch64-linux","runner":"ubuntu-24.04-arm"}]
          expect-checks: ${{ matrix.expect-checks }}
          override-inputs: ${{ matrix.override-inputs || '{}' }}
      - env:
          OUTCOME: ${{ steps.flake-checks.outcome }}
          EXPECTED: ${{ matrix.outcome }}
        run: tests/ci/outcome.sh

  check:
    needs: [fixtures]
    # Dispatched runs post their final status on every outcome.
    if: ${{ !cancelled() || github.event_name == 'workflow_dispatch' }}
    uses: $/.github/workflows/check.yaml
    permissions:
      actions: read # own job name and the jobs of the run
      contents: read # repository files through the contents API
      pull-requests: read # the title of the pull request
      statuses: write # commit statuses of dispatched runs
    with:
      needs: ${{ toJSON(needs) }}
      expect-checks: '["formatting","shell","unit"]'
      renovate-presets: '["flakeyard/renovate-config"]'
      # A flakeyard repository keeps no configuration files of atom tools
      # (FY-0037).
      forbid-tool-configs: true
