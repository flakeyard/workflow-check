name: Status context
description: >-
  Derives the context of the commit status from the name of the job that runs
  this action: "check / pending" and "check / required" both give
  "check / required".
inputs:
  shell-lib:
    description: The directory of the shell library, the output path of action-shell-lib.
    required: true
  check-run-id:
    description: The check run id of the job, job.check_run_id.
    required: true
outputs:
  context:
    description: The context, the job's name with its last part replaced by required.
    value: ${{ steps.run.outputs.context }}
runs:
  using: composite
  steps:
    - id: run
      shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ inputs.shell-lib }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        CHECK_RUN_ID: ${{ inputs.check-run-id }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" context GH_TOKEN REPO CHECK_RUN_ID
        GITHUB_OUTPUT GITHUB_STEP_SUMMARY
