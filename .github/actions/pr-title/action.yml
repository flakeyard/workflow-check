name: Pull request title
description: >-
  Fails unless the title of the pull request, or of every open pull request of
  a dispatched branch, follows Conventional Commits with the given types.
inputs:
  shell-lib:
    description: The directory of the shell library, the output path of action-shell-lib.
    required: true
  enabled:
    description: "'false' switches the check off; it then succeeds with a notice."
    default: "true"
  types:
    description: The allowed types, lower-case words separated by single spaces.
    required: true
runs:
  using: composite
  steps:
    - shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ inputs.shell-lib }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        NUMBER: ${{ github.event.pull_request.number }}
        OWNER: ${{ github.repository_owner }}
        BRANCH: ${{ github.ref_name }}
        ENABLED: ${{ inputs.enabled }}
        TYPES: ${{ inputs.types }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" pr-title GH_TOKEN REPO EVENT NUMBER
        OWNER BRANCH ENABLED TYPES GITHUB_STEP_SUMMARY
