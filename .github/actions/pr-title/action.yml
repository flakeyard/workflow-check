name: Pull request title
description: >-
  Fails unless the title of the pull request, or of every open pull request of
  a dispatched branch, follows Conventional Commits with the given types.
inputs:
  enabled:
    description: "'false' switches the check off; it then succeeds with a notice."
    default: "true"
  types:
    description: The allowed types, lower-case words separated by single spaces.
    required: true
runs:
  using: composite
  steps:
    - shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        EVENT: ${{ github.event_name }}
        NUMBER: ${{ github.event.pull_request.number }}
        OWNER: ${{ github.repository_owner }}
        BRANCH: ${{ github.ref_name }}
        ENABLED: ${{ inputs.enabled }}
        TYPES: ${{ inputs.types }}
      run: '"$GITHUB_ACTION_PATH/run.sh"'
