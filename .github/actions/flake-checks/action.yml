name: Flake checks
description: >-
  Evaluates a flake and builds its checks for the system of the runner, after
  checking that the runners given cover exactly the systems the flake declares.
inputs:
  shell-lib:
    description: The directory of the shell library, the output path of action-shell-lib.
    required: true
  flake:
    description: The flake, "." or a relative path such as ./dev.
    required: true
  system:
    description: The system of this runner, such as x86_64-linux.
    required: true
  systems:
    description: JSON array of {system, runner}, every system the checks run on.
    required: true
  expect-checks:
    description: JSON array of check names that the flake must have.
    default: "[]"
  override-inputs:
    description: >-
      JSON object of the inputs of the root to override and their flake
      references, which start with git+https:// or github:.
    default: "{}"
runs:
  using: composite
  steps:
    - shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ inputs.shell-lib }}
        FLAKE: ${{ inputs.flake }}
        SYSTEM: ${{ inputs.system }}
        SYSTEMS: ${{ inputs.systems }}
        EXPECT_CHECKS: ${{ inputs.expect-checks }}
        OVERRIDE_INPUTS: ${{ inputs.override-inputs }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" flake-checks FLAKE SYSTEM SYSTEMS
        EXPECT_CHECKS OVERRIDE_INPUTS GITHUB_STEP_SUMMARY PATH HOME
        XDG_CONFIG_HOME XDG_CACHE_HOME
