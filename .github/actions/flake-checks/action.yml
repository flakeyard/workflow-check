name: Flake checks
description: >-
  Evaluates a flake and builds its checks for the system of the runner, after
  checking that the runners given cover exactly the systems the flake declares.
inputs:
  shell-lib:
    description: The directory of the shell library, the output path of action-shell-lib.
    required: true
  flake:
    description: The flake, "." or a relative path such as ./dev.
    required: true
  system:
    description: The system of this runner, such as x86_64-linux.
    required: true
  systems:
    description: JSON array of {system, runner}, every system the checks run on.
    required: true
  expect-checks:
    description: JSON array of check names that the flake must have.
    default: "[]"
runs:
  using: composite
  steps:
    - shell: bash
      env:
        SHELL_LIB: ${{ inputs.shell-lib }}
        FLAKE: ${{ inputs.flake }}
        SYSTEM: ${{ inputs.system }}
        SYSTEMS: ${{ inputs.systems }}
        EXPECT_CHECKS: ${{ inputs.expect-checks }}
      run: '"$GITHUB_ACTION_PATH/run.sh"'
