name: Commit status
description: >-
  Posts a commit status on the checked commit for a run started by
  workflow_dispatch, whose check runs do not count for required checks.
inputs:
  shell-lib:
    description: The directory of the shell library, the output path of action-shell-lib.
    required: true
  state:
    description: pending, success or failure.
    required: true
  context:
    description: The context, from the context action.
    required: true
runs:
  using: composite
  steps:
    - shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ inputs.shell-lib }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        STATE: ${{ inputs.state }}
        CONTEXT: ${{ inputs.context }}
        RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" commit-status GH_TOKEN REPO SHA STATE
        CONTEXT RUN_URL GITHUB_STEP_SUMMARY
