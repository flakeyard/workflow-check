name: Release tags
description: >-
  Fails unless every Renovate preset and Copier template that the repository
  references is pinned to the tag of an immutable GitHub release.
inputs:
  shell-lib:
    description: The directory of the shell library, the output path of action-shell-lib.
    required: true
  enabled:
    description: "'false' switches the check off; it then succeeds with a notice."
    default: "true"
  allow-unpinned:
    description: >-
      JSON array of owner/repo whose presets and templates are not checked.
    default: "[]"
runs:
  using: composite
  steps:
    - shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ inputs.shell-lib }}
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        SHA: ${{ github.sha }}
        ENABLED: ${{ inputs.enabled }}
        ALLOW_UNPINNED: ${{ inputs.allow-unpinned }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" release-tags GH_TOKEN REPO SHA
        ENABLED ALLOW_UNPINNED GITHUB_STEP_SUMMARY
