name: Preflight
description: Fails unless the caller's event is one that the check workflow supports.
inputs:
  shell-lib:
    description: The directory of the shell library, the output path of action-shell-lib.
    required: true
runs:
  using: composite
  steps:
    - shell: /usr/bin/bash --noprofile --norc -p -e -o pipefail {0}
      env:
        SHELL_LIB: ${{ inputs.shell-lib }}
        EVENT: ${{ github.event_name }}
      run: >-
        /usr/bin/bash -p "$SHELL_LIB/run-step.sh"
        "$GITHUB_ACTION_PATH/scripts/step" preflight EVENT GITHUB_STEP_SUMMARY
